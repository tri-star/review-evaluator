[project]
name = "review-evaluator"
version = "0.1.0"
description = "Lambda package for AI review daily evaluation."
requires-python = ">=3.12"
dependencies = [
  "pyjwt[crypto]>=2.10.1",
]

[dependency-groups]
dev = [
  "pre-commit>=4.2.0",
  "pytest>=8.4.0",
  "ruff>=0.11.13",
]

[tool.ruff]
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
